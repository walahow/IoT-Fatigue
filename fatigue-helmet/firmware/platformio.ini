[platformio]
default_envs = esp32s3cam

[env:esp32s3cam]
; ── Debug mode: camera frames + CSV streamed over USB-UART to debug_recorder.py
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
src_filter = +<*> -<sensor_test.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DSTORAGE_MODE_USB
lib_deps =
    electroniccats/MPU6050@^1.4.4
    Wire
    esp32-camera

[env:esp32s3cam_frame_inject]
; ── Debug tool: PC sends pre-recorded JPEG frames one at a time over USB
; serial; this build runs the SAME on-device EAR/glint pipeline on each one
; via processEarFrame() -- the real compiled ESP32 binary, not a PC
; recompile of the algorithm (see tools/session_replay for that PC-side
; variant) -- exactly as if it had captured the frame live, and reports
; back ROI-lock/blink status. No live camera capture task runs in this
; mode: frameInjectTask() owns Serial exclusively for the injection
; protocol. Not for production -- for validating the real firmware against
; reference footage without live-camera timing/bandwidth constraints.
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
src_filter = +<*> -<sensor_test.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DSTORAGE_MODE_USB
    -DEAR_LIVE_DEBUG
    -DFRAME_INJECT_MODE
lib_deps =
    electroniccats/MPU6050@^1.4.4
    Wire
    esp32-camera

[env:esp32s3cam_ear_preview]
; ── Debug tool: same USB video streaming as esp32s3cam, but ALSO runs the
; on-device EAR/glint blink pipeline (normally SD-mode only) on the frame
; before streaming it, so a PC overlay can draw the ESP's own ROI lock and
; real blink events on top of the live video -- not a PC-side Haar-cascade
; guess. CAMERA_FRAMESIZE is forced back to QVGA (matching esp32s3cam_sd):
; the EAR decode costs ~97 ms/frame at QVGA (already proven safe there) and
; would be ~4x worse at this build's normal VGA default, risking the
; watchdog boot-loop cameraTask's yield comment documents. Not for
; production -- for live blink-detection debugging only.
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
src_filter = +<*> -<sensor_test.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DSTORAGE_MODE_USB
    -DEAR_LIVE_DEBUG
    -DCAMERA_FRAMESIZE=FRAMESIZE_QVGA
    -DCAMERA_FPS=20
    -DCAMERA_JPEG_QUALITY=10
lib_deps =
    electroniccats/MPU6050@^1.4.4
    Wire
    esp32-camera

[env:esp32s3cam_sd]
; ── Production mode: everything saved to microSD card (SD_MMC 1-bit)
; SD pins (Freenove ESP32-S3-WROOM CAM, do not modify):
;   CMD = GPIO 38  |  CLK = GPIO 39  |  D0 = GPIO 40
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
src_filter = +<*> -<sensor_test.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DSTORAGE_MODE_SD
    ; ── Camera resolution & FPS (OV2640 + SD_MMC 1-bit budget) ───────────────
    ; VGA@20fps  ≈ 300-500 KB/s write  -- comfortable on 1-bit SD
    ; CIF@30fps  ≈ 180-270 KB/s write  -- even safer, smoother motion
    ; QVGA@30fps ≈ 120-150 KB/s write  -- lightest, max FPS
    ; To change resolution: swap FRAMESIZE below
    -DCAMERA_FRAMESIZE=FRAMESIZE_QVGA
    -DCAMERA_FPS=20
    -DCAMERA_JPEG_QUALITY=10
    ; ── Phone arming preview: Wi-Fi AP "HELMET-xxxx", page at http://192.168.4.1
    ; (docs/superpowers/specs/2026-09-23-phone-arming-preview-design.md).
    ; Delete these two lines for the no-Wi-Fi build. WPA2 needs 8+ characters;
    ; change the password before taking the helmet anywhere shared.
    -DPHONE_PREVIEW
    -DPHONE_AP_PASS=\"helmet-arm\"
lib_deps =
    electroniccats/MPU6050@^1.4.4
    Wire
    esp32-camera

[env:esp32s3cam_test_sd]
; ── Test mode: SD card enabled, hardware test mode for buzzer and sensors
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
src_filter = +<*> -<sensor_test.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DSTORAGE_MODE_SD
    -DTEST_MODE_HARDWARE
    -DCAMERA_FRAMESIZE=FRAMESIZE_VGA
    -DCAMERA_FPS=20
    -DCAMERA_JPEG_QUALITY=10
lib_deps =
    electroniccats/MPU6050@^1.4.4
    Wire
    esp32-camera

[env:native]
; ── Host-side unit tests for hardware-independent modules (EyeBlinkEAR.h) ──
; Run with: pio test -e native -f test_eye_blink_ear -v
platform = native
; -I host_shim: the host stand-in for <Arduino.h> that lets FuzzyFatigue.h compile on the PC
build_flags = -std=gnu++14 -Itools/session_replay/host_shim

[env:sensor_test]
; ── Standalone sensor stability test (pulse, IMU, camera) — 30s per sensor
; Compile:  pio run -e sensor_test -t upload --upload-port COM_PORT
; Monitor:  pio device monitor -b 921600 -p COM_PORT
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
src_filter = +<*> -<main.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
lib_deps =
    electroniccats/MPU6050@^1.4.4
    Wire
    esp32-camera
